    <link rel="icon" type="image/x-icon" href="/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon/favicon-48x48.png">
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon/favicon-64x64.png">
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon/favicon-128x128.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/favicon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon/favicon-192x192.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Políticas — Velonox</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/vendor/tabler-icons/tabler-icons.min.css">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'DM Sans',sans-serif;background:#F5F5F3;color:#0F1A14}
        nav{background:#0F1A14;padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
        .nav-logo{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;letter-spacing:-.5px;text-decoration:none}
        .nav-logo .a{color:#C8D8C0}.nav-logo .b{color:#1D7A4F}
        .nav-links{display:flex;gap:1.5rem}
        .nav-links a{font-size:13px;color:#C8D8C0;text-decoration:none;opacity:.7;transition:opacity .2s}
        .nav-links a:hover{opacity:1}
        .nav-right{display:flex;gap:12px;align-items:center}
        .nav-icon{color:#C8D8C0;opacity:.7;font-size:18px;cursor:pointer;text-decoration:none}
        .nav-icon:hover{opacity:1}
        .nav-user{font-size:12px;color:#6B8A7A}
        .nav-admin{font-size:12px;color:#4A6A5A;text-decoration:none;padding:4px 10px;border:1px solid #2A4A38;border-radius:2px}
        .nav-burger{display:none;flex-direction:column;justify-content:center;gap:5px;width:22px;height:18px;background:none;border:none;cursor:pointer;padding:0}
        .nav-burger span{display:block;width:100%;height:2px;background:#C8D8C0;transition:transform .25s,opacity .25s}
        .nav-burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
        .nav-burger.open span:nth-child(2){opacity:0}
        .nav-burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

        /* HERO */
        .hero{background:#0F1A14;padding:5rem 2rem 4rem;text-align:center}
        .hero-eyebrow{font-size:11px;font-weight:500;letter-spacing:.18em;color:#1D7A4F;text-transform:uppercase;margin-bottom:1.2rem}
        .hero h1{font-family:'Playfair Display',serif;font-size:clamp(36px,5vw,56px);font-weight:900;color:#C8D8C0;line-height:1.1;letter-spacing:-2px;margin-bottom:1rem}
        .hero p{font-size:15px;color:#6B8A7A;max-width:500px;margin:0 auto;line-height:1.7}

        /* NAV TABS */
        .policy-nav{background:white;border-bottom:2px solid #E8E8E4;position:sticky;top:56px;z-index:99}
        .policy-nav-inner{max-width:900px;margin:0 auto;display:flex;overflow-x:auto}
        .policy-nav a{padding:1rem 1.5rem;font-size:13px;font-weight:500;color:#B0BEB8;text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s}
        .policy-nav a:hover{color:#0F1A14}
        .policy-nav a.active{color:#1D7A4F;border-bottom-color:#1D7A4F}

        /* CONTENT */
        .content{max-width:900px;margin:0 auto;padding:3rem 2rem 5rem}

        /* SECCIÓN */
        .policy-section{margin-bottom:4rem;scroll-margin-top:120px}
        .section-header{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid #E8E8E4}
        .section-icon{width:44px;height:44px;background:#0F1A14;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .section-icon i{font-size:20px;color:#1D7A4F}
        .section-eyebrow{font-size:10px;font-weight:500;letter-spacing:.18em;color:#1D7A4F;text-transform:uppercase;margin-bottom:.25rem}
        .section-title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#0F1A14}

        /* TEXTO */
        .policy-text p{font-size:14px;color:#4A6A5A;line-height:1.8;margin-bottom:1rem}
        .policy-text h4{font-size:14px;font-weight:600;color:#0F1A14;margin:1.5rem 0 .5rem}
        .policy-text ul{padding-left:1.25rem;margin-bottom:1rem}
        .policy-text ul li{font-size:14px;color:#4A6A5A;line-height:1.8;margin-bottom:.3rem}

        /* CARDS DE INFO */
        .info-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;margin:1.5rem 0}
        .info-card{background:#0F1A14;border-radius:4px;padding:1.25rem;text-align:center}
        .info-card i{font-size:24px;color:#1D7A4F;margin-bottom:.6rem;display:block}
        .info-card strong{font-size:13px;color:#C8D8C0;display:block;margin-bottom:.3rem}
        .info-card span{font-size:12px;color:#4A6A5A;line-height:1.4}

        /* TABLA */
        .policy-table{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:13px}
        .policy-table th{background:#0F1A14;color:#C8D8C0;padding:.75rem 1rem;text-align:left;font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
        .policy-table td{padding:.75rem 1rem;border-bottom:1px solid #E8E8E4;color:#4A6A5A;vertical-align:top}
        .policy-table tr:last-child td{border-bottom:none}
        .policy-table tr:nth-child(even) td{background:#FAFAF8}

        /* HIGHLIGHT */
        .highlight{background:#F0FAF5;border:1px solid #A8D8BC;border-radius:4px;padding:1rem 1.25rem;margin:1.5rem 0;display:flex;gap:.75rem;align-items:flex-start}
        .highlight i{color:#1D7A4F;font-size:18px;flex-shrink:0;margin-top:1px}
        .highlight p{font-size:13px;color:#1D5A3A;line-height:1.6;margin:0}
        .highlight strong{color:#0F3A20}

        .warning{background:#FFFBEB;border:1px solid #FCD34D;border-radius:4px;padding:1rem 1.25rem;margin:1.5rem 0;display:flex;gap:.75rem;align-items:flex-start}
        .warning i{color:#D97706;font-size:18px;flex-shrink:0;margin-top:1px}
        .warning p{font-size:13px;color:#78350F;line-height:1.6;margin:0}

        /* CTA */
        .cta-box{background:#1A2820;border:1px solid #243B2C;border-radius:4px;padding:2rem;text-align:center;margin-top:3rem}
        .cta-box p{font-size:14px;color:#6B8A7A;margin-bottom:1rem;line-height:1.6}
        .cta-box strong{color:#C8D8C0;display:block;font-family:'Playfair Display',serif;font-size:20px;margin-bottom:.5rem}
        .whatsapp-btn{display:inline-flex;align-items:center;gap:.6rem;background:#1D7A4F;color:#F5F5F3;padding:.75rem 1.5rem;border-radius:4px;text-decoration:none;font-weight:600;font-size:14px;transition:background .2s}
        .whatsapp-btn:hover{background:#22904F}

        /* FOOTER */
        footer{background:#0F1A14;padding:2rem;border-top:1px solid #1A2820}
        .footer-top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:1.5rem;margin-bottom:1.5rem;max-width:1100px;margin-left:auto;margin-right:auto}
        .footer-logo{font-family:'Playfair Display',serif;font-size:18px;font-weight:700}
        .footer-logo .a{color:#C8D8C0}.footer-logo .b{color:#1D7A4F}
        .footer-tagline{font-size:12px;color:#4A6A5A;margin-top:4px;font-style:italic}
        .footer-col p{font-size:11px;font-weight:500;color:#6B8A7A;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.75rem}
        .footer-col a{display:block;font-size:13px;color:#4A6A5A;text-decoration:none;margin-bottom:5px}
        .footer-col a:hover{color:#C8D8C0}
        .footer-bottom{border-top:1px solid #1A2820;padding-top:1rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;max-width:1100px;margin:0 auto}
        .footer-copy{font-size:11px;color:#2A4A38}
        .footer-social{display:flex;gap:12px}
        .footer-social i{font-size:18px;color:#2A4A38;cursor:pointer}
        .footer-social i:hover{color:#1D7A4F}

        @media(max-width:768px){
            .nav-burger{display:flex}
            .nav-links{
                display:flex;position:absolute;top:56px;left:0;right:0;
                flex-direction:column;gap:0;background:#0F1A14;
                max-height:0;overflow:hidden;border-bottom:1px solid #1A2820;
                transition:max-height .25s ease;
            }
            .nav-links.open{max-height:260px}
            .nav-links a{padding:.9rem 1.25rem;opacity:1;border-top:1px solid #1A2820}
            .info-cards{grid-template-columns:1fr 1fr}
        }
    </style>
</head>

<body>

<!-- NAV -->
<nav>
    <a href="/index.html" class="nav-logo"><span class="a">Velo</span><span class="b">nox</span></a>
    <div class="nav-links">
        <a href="/categorias.html">Cocina</a><a href="/index.html">Sets</a><a href="/nosotros.html">Nosotros</a>
    </div>
    <div class="nav-right">
        <span class="nav-user" id="nav-user"></span>
        <a href="/cart.html" class="nav-icon"><i class="ti ti-shopping-bag"></i></a>
        <a href="/admin.html" class="nav-admin" id="nav-admin" style="display:none">Admin</a>
        <a href="/login.html" class="nav-icon" id="nav-login"><i class="ti ti-user"></i></a>
        <a href="#" class="nav-icon" id="nav-logout" style="display:none" onclick="logout();return false"><i class="ti ti-logout"></i></a>
        <button class="nav-burger" id="nav-burger" aria-label="Abrir menú" aria-expanded="false" onclick="toggleNavMenu()">
            <span></span><span></span><span></span>
        </button>
    </div>
</nav>

<div id="layout-container"></div>

<script src="/js/api.js"></script>
<script src="/js/page-blocks.js"></script>
<script>
    async function init() {
        if (isLoggedIn()) {
            document.getElementById("nav-login").style.display = "none";
            document.getElementById("nav-logout").style.display = "block";
            try {
                const me = await getMe();
                document.getElementById("nav-user").textContent = me.full_name.split(" ")[0];
                if (me.is_admin) document.getElementById("nav-admin").style.display = "block";
            } catch(e) {}
        }
        await initPageBlocks("politicas");
    }

    function toggleNavMenu() {
        const open = document.querySelector(".nav-links").classList.toggle("open");
        const burger = document.getElementById("nav-burger");
        burger.classList.toggle("open", open);
        burger.setAttribute("aria-expanded", open);
    }
    document.querySelectorAll(".nav-links a").forEach(a => a.addEventListener("click", () => {
        document.querySelector(".nav-links").classList.remove("open");
        document.getElementById("nav-burger").classList.remove("open");
    }));

    function setActive(el) {
        document.querySelectorAll(".policy-nav a").forEach(a => a.classList.remove("active"));
        el.classList.add("active");
    }

    // Actualiza el tab activo al hacer scroll
    window.addEventListener("scroll", () => {
        const sections = ["envios","devoluciones","garantia","privacidad","pagos"];
        for (const id of sections) {
            const el = document.getElementById(id);
            if (!el) continue;
            const rect = el.getBoundingClientRect();
            if (rect.top <= 130 && rect.bottom > 130) {
                document.querySelectorAll(".policy-nav a").forEach(a => a.classList.remove("active"));
                const link = document.querySelector(`.policy-nav a[href="#${id}"]`);
                if (link) link.classList.add("active");
                break;
            }
        }
    });

    init();
</script>
</body>
